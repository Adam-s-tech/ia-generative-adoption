<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="Capture fictive d'un assistant documentaire">
  <rect width="1100" height="560" fill="#F6F7FB"/>
  <rect x="40" y="30" width="1020" height="60" rx="10" fill="#2D3561"/>
  <text x="70" y="68" font-family="Arial" font-size="24" fill="#FFFFFF" font-weight="bold">Assistant documentaire · démo fictive</text>
  <rect x="60" y="120" width="960" height="90" rx="10" fill="#E9E5F7"/>
  <text x="85" y="155" font-family="Arial" font-size="16" fill="#5847A7" font-weight="bold">Vous</text>
  <text x="85" y="185" font-family="Arial" font-size="18" fill="#333">Quel est le délai de traitement d'une demande ?</text>
  <rect x="60" y="230" width="960" height="220" rx="10" fill="#FFFFFF" stroke="#D9DCE8"/>
  <text x="85" y="265" font-family="Arial" font-size="16" fill="#2D3561" font-weight="bold">Assistant</text>
  <text x="85" y="300" font-family="Arial" font-size="18" fill="#333">Le délai de traitement est de 10 jours ouvrés à compter de la réception</text>
  <text x="85" y="330" font-family="Arial" font-size="18" fill="#333">du dossier complet.</text>
  <text x="85" y="375" font-family="Arial" font-size="16" fill="#666">Source : guide interne, section 3</text>
  <rect x="60" y="470" width="960" height="50" rx="10" fill="#FFFFFF" stroke="#D9DCE8"/>
  <text x="85" y="501" font-family="Arial" font-size="16" fill="#999">Poser une question…</text>
  <text x="85" y="540" font-family="Arial" font-size="14" fill="#666">Données fictives. Aucune donnée client.</text>
</svg>
